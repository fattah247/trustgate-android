name: Build provenance

# Builds the release APK and the server, then has GitHub sign a statement of where each file came
# from: this repository, this commit, this workflow, run on GitHub's own runners. Anyone holding a
# file can check it with `gh attestation verify`; see docs/SUPPLY_CHAIN.md.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # A short-lived identity token, exchanged for the Sigstore certificate that signs the attestations.
      id-token: write
      # To keep the attestations with the repository, where `gh attestation verify` finds them.
      attestations: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # No cache: what's attested is built only from this commit and verified downloads, not from
      # anything an earlier run left behind.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.1"

      - name: Build release APK and server
        run: ./gradlew :app:assembleRelease :server:distZip --console=plain

      - name: Collect files and checksums
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/trustgate-release-unsigned.apk
          cp server/build/distributions/server.zip dist/trustgate-server.zip
          cd dist && sha256sum trustgate-release-unsigned.apk trustgate-server.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Upload attested files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trustgate-${{ github.sha }}
          path: dist/
          retention-days: 30
